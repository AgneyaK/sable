<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sable Tests</title>
  <style>
    :root { --bg: #fff; --fg: #222; --ok: #2f8a57; --bad: #c8423b; --muted: #888; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15171c; --fg: #e4e4e7; --ok: #6fd192; --bad: #ff7b72; } }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    h1 { font: 600 18px system-ui, sans-serif; margin: 0 0 12px; }
    .ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--muted); }
    pre { white-space: pre-wrap; margin: 4px 0 12px 18px; }
  </style>
</head>
<body>
  <h1>Sable test suite</h1>
  <div id="summary" class="muted">running...</div>
  <div id="results"></div>
  <script type="module">
    globalThis.readTextFile = (path) => fetch(new URL(`../${path}`, import.meta.url)).then((r) => r.text());
    const { runTests } = await import('./harness.js');
    await import('./suites.js');
    const results = document.getElementById('results');
    const { passed, failed } = await runTests(({ name, ok, error }) => {
      const row = document.createElement('div');
      row.className = ok ? 'ok' : 'bad';
      row.textContent = `${ok ? '✓' : '✗'} ${name}`;
      results.append(row);
      if (!ok) {
        const pre = document.createElement('pre');
        pre.textContent = error?.stack ?? String(error);
        results.append(pre);
      }
    });
    const summary = document.getElementById('summary');
    summary.className = failed ? 'bad' : 'ok';
    summary.textContent = `${passed} passed, ${failed} failed`;
  </script>
</body>
</html>
